[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdai"
version = "0.1.0"
description = "GDAI — нейросеть, которая учится проходить Geometry Dash (зрение + PPO)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "pygame>=2.5",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Опциональные группы: базовый сценарий обязан работать без них.
media = ["imageio>=2.31", "opencv-python-headless"]
realgame = ["mss", "pynput"]
dev = ["pytest>=7.0"]

[project.scripts]
gdai = "gdai.cli:main"

[tool.setuptools.packages.find]
include = ["gdai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
