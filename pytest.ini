; Конфигурация pytest для GDAI.
;
; Зачем отдельный pytest.ini, а не секция в pyproject: файл в корне имеет
; приоритет над [tool.pytest.ini_options] и задаёт rootdir однозначно, поэтому
; `pytest` из любого подкаталога находит те же тесты и те же настройки.
;
; Ключевые решения:
;  * SDL_VIDEODRIVER=dummy выставляется в tests/conftest.py, а не здесь:
;    переменная нужна ДО `import pygame`, а плагина pytest-env в зависимостях нет.
;  * --strict-markers — опечатка в имени маркера должна падать, иначе фильтр
;    `-m "not slow"` тихо перестанет что-либо отсекать.
;  * маркер slow — тяжёлые тесты; в CI прогон идёт с `-m "not slow"`.

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers --strict-config --durations=10
markers =
    slow: тяжёлый тест (в CI отключается через -m "not slow")
filterwarnings =
    default
    ignore:pkg_resources is deprecated as an API.*:DeprecationWarning
